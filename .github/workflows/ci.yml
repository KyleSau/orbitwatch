name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # manual run of the live evals below

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (offline; live tests are skipped)
        run: pytest -q
      - name: Evals (golden + red-team; offline planner, fixtures, stub judge)
        run: python -m evals.run_evals
      - name: Trace summary of the eval run
        if: always()
        run: orbitwatch trace summary --file evals/results/traces.jsonl --html evals/results/trace_report.html
      - name: Upload eval results and trace report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-${{ matrix.python-version }}
          path: evals/results/

  live-evals:
    # Claude agent + LLM-as-judge on fixtures. Manual only (it costs money), and skipped
    # cleanly when the repository has no ANTHROPIC_API_KEY secret.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Live evals with Claude judge
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret; skipping."; exit 0; fi
          python -m evals.run_evals --live --judge claude
          orbitwatch trace summary --file evals/results/traces.jsonl --html evals/results/trace_report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evals
          path: evals/results/
